services:
  postgres:
    image: postgres:16-alpine
    container_name: otms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-otms}
      POSTGRES_USER: ${POSTGRES_USER:-otms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otms_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - otms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otms} -d ${POSTGRES_DB:-otms}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  otms-postgres-data:
