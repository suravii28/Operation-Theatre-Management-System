server:
  port: 8080

spring:
  application:
    name: otms-backend
  datasource:
    url: jdbc:h2:mem:otms;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # Override JWT_SECRET in any real deployment; the default is for local dev only.
  secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
