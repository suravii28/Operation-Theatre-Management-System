name: Browser E2E smoke (Chromium)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: End-to-end browser walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Start backend and frontend
        run: |
          (cd backend && ./mvnw -B -q spring-boot:run > "$GITHUB_WORKSPACE/e2e-backend.log" 2>&1) &
          (cd frontend && npm run dev -- --host 127.0.0.1 > "$GITHUB_WORKSPACE/e2e-frontend.log" 2>&1) &
      - name: Wait for both services
        run: |
          for n in $(seq 1 90); do
            backend=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:8080/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"coordinator@otms.local","password":"Coord123!"}' || true)
            frontend=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5173/login || true)
            if [ "$backend" = "200" ] && [ "$frontend" = "200" ]; then exit 0; fi
            sleep 2
          done
          tail -50 e2e-backend.log || true
          tail -50 e2e-frontend.log || true
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --prefix /tmp/otms-playwright playwright
          /tmp/otms-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Execute browser smoke checks
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/otms-playwright/node_modules/playwright
          E2E_EMAIL: coordinator@otms.local
          E2E_PASSWORD: Coord123!
        run: node scripts/browser-smoke.cjs
      - name: Upload browser evidence and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otms-browser-e2e-smoke
          path: |
            docs/reports/browser-e2e-latest/
            e2e-backend.log
            e2e-frontend.log
          if-no-files-found: warn
